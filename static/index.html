<!doctype html>

<html ng-app="app">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.0/angular.min.js"></script>
    <script src="index.js"></script>
    <style>
        .block {
          margin-bottom: 32px;
        }
    </style>
</head>

<body>

<div class="container" ng-controller="indexController">
    <h1>Market</h1>
    <h3>Список товаров</h3>
    <img src="123.png">
    <table class="table table-hover" cellpadding="0" cellspacing="0">
        <tr>
            <td>Название</td>
            <td>Цена</td>
            <td></td>
        </tr>
        <tbody>
        <tr ng-repeat="p in ProductsList">
            <td>
                <input class="form-control"
                       type="text"
                       ng-model="p.title">
            </td>

            <td>
                <input class="form-control"
                       type="number"
                       ng-model="p.price">
            </td>
            <td>
                <button class="btn btn-primary mr-2" ng-click="updateProduct(p)">Обновить</button>
                <button class="btn btn-danger" ng-click="deleteProductById(p.id)">Удалить товар</button>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="block">
    <button class="btn btn-secondary mt-2" ng-click="fillTable()">Показать все товары</button>
    </div>

    <div class="block">
    <h3>Добавить новый товар</h3>
    <form novalidate ng-submit="submitCreateNewProduct()">
        <div class="form-group col-md-6">
            <label for="newProductTitle">Название</label>
            <input class="form-control" type="text" ng-model="newProduct.title" id="newProductTitle">
        </div>
        <div class="form-group col-md-6">
            <label for="newProductPrice">Цена</label>
            <input class="form-control" type="number" ng-model="newProduct.price" id="newProductPrice">
        </div>
        <div>
            <button class="btn btn-success" type="submit">Сохранить</button>
        </div>
    </form>
    </div>

    <div class="block">
    <h3>Найти товар по ID</h3>
        <form novalidate ng-submit="getProductById()">
            <div class="form-group col-md-7">
                <label for="productID">ID</label>
                <input class="form-control"
                       type="number"
                       ng-model="product.id"
                       id="productID">
            </div>

            <button class="btn btn-success" type="submit">
                Найти
            </button>
        </form>
    </div>
</div>
</body>
</html>
